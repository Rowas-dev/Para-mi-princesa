<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rompecabezas 💖</title>

<style>

body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:#c98f9f;
    font-family:Arial, sans-serif;
}

h1{
    color:white;
    margin:20px;
    text-shadow:0 2px 5px rgba(0,0,0,0.3);
}

/* Puzzle */

#puzzle{
    width:640px;
    height:640px;
    display:grid;
    grid-template-columns:repeat(8, 1fr);
    grid-template-rows:repeat(8, 1fr);
    gap:1px;
    background:white;
    border:4px solid white;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

/* Piezas */

.piece{
    width:80px;
    height:80px;

    background-image:url("IMG-20260316-WA0097.jpg");

    background-size:640px 640px;

    cursor:grab;

    transition:0.15s;
}

.piece:hover{
    filter:brightness(1.1);
}

/* Botón */

button{
    margin-top:20px;
    padding:12px 24px;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

/* Mensaje */

#message{
    margin-top:15px;
    color:white;
    font-size:24px;
    margin-bottom:20px;
}

</style>
</head>

<body>

<h1>Rompecabezas 💙</h1>

<div id="puzzle"></div>

<button onclick="startGame()">
Reiniciar
</button>

<div id="message"></div>

<script>

const puzzle = document.getElementById("puzzle");
const message = document.getElementById("message");

const size = 8;
const total = size * size;

let pieces = [];

/* Iniciar */

function startGame(){

    message.textContent = "";

    pieces = [];

    for(let i = 0; i < total; i++){

        pieces.push(i);
    }

    shuffle(pieces);

    render();
}

/* Mezclar */

function shuffle(array){

    for(let i = array.length - 1; i > 0; i--){

        const j = Math.floor(Math.random() * (i + 1));

        [array[i], array[j]] = [array[j], array[i]];
    }
}

/* Dibujar puzzle */

function render(){

    puzzle.innerHTML = "";

    pieces.forEach((piece, index) => {

        const div = document.createElement("div");

        div.classList.add("piece");

        div.dataset.index = index;

        const x = (piece % size) * 80;

        const y = Math.floor(piece / size) * 80;

        div.style.backgroundPosition =
        `-${x}px -${y}px`;

        /* Arrastrar */

        div.draggable = true;

        div.addEventListener("dragstart", dragStart);

        div.addEventListener("dragover", dragOver);

        div.addEventListener("drop", drop);

        puzzle.appendChild(div);
    });

    checkWin();
}

/* Drag & Drop */

let draggedIndex = null;

function dragStart(){

    draggedIndex = this.dataset.index;
}

function dragOver(e){

    e.preventDefault();
}

function drop(){

    const targetIndex = this.dataset.index;

    /* Intercambiar */

    [pieces[draggedIndex], pieces[targetIndex]] =

    [pieces[targetIndex], pieces[draggedIndex]];

    render();
}

/* Ganar */

function checkWin(){

    let correct = true;

    for(let i = 0; i < total; i++){

        if(pieces[i] !== i){

            correct = false;
            break;
        }
    }

    if(correct){

        message.textContent =
        "✨ Completaste el rompecabezas ✨";
    }
}

startGame();

</script>

</body>
</html>
